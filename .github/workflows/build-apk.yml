name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4  # ✅ Updated to v4
    
    # Step 2: Setup Java
    - name: Set up Java 17
      uses: actions/setup-java@v4  # ✅ Updated to v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    # Step 3: Setup Flutter (using official Flutter action)
    - name: Set up Flutter
      uses: flutter-actions/setup-flutter@v3  # ✅ Changed to official action
      with:
        version: '3.16.0'
        channel: 'stable'
    
    # Step 4: Get dependencies
    - name: Get Flutter dependencies
      run: flutter pub get
    
    # Step 5: Build APK
    - name: Build APK
      run: flutter build apk --release
    
    # Step 6: Upload APK as artifact (updated to v4)
    - name: Upload APK
      uses: actions/upload-artifact@v4  # ✅ Updated to v4
      with:
        name: quizllm-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
    
    # Step 7: Create Release (optional)
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
        tag_name: v${{ github.run_number }}
        name: QuizLLM v${{ github.run_number }}
        body: |
          Automated APK build
          
          **Commit:** ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false
